    if(y>=1&&y<=8&&x>=1&&x<=7)return'#d4b896';   // Marketing

    if(y>=1&&y<=6&&x>=18&&x<=24)return'#b0b0a8';  // Empty

    return'#888';
}

function blk(x,y,w,h){for(let dy=0;dy<(h||1);dy++)for(let dx=0;dx<(w||1);dx++)if(y+dy<MH&&x+dx<MW&&M[y+dy][x+dx]===0)M[y+dy][x+dx]=3;}

/*
 * DESK PAIRS (3 tiles wide, facing each other):
 * Person A (top): sits at yt-1, faces DOWN (dir=2), monitors on far edge of desk (yt row, near top)
 * Person B (bot): sits at yt+2, faces UP (dir=0), monitors on far edge of desk (yt+1 row, near bottom)
 *
 * Monitor positions:
 *   Top desk monitors: at TOP edge of desk yt (far from person A who sits below at yt-1)
 *     -> Person A looks DOWN at monitors -> we (viewer) see the BACK of these monitors
 *   Bottom desk monitors: at BOTTOM edge of desk yt+1 (far from person B who sits above at yt+2)
 *     -> Person B looks UP at monitors -> we see the SCREEN of these monitors
 *
 * WAIT - user says "мониторы с другого краю" - monitors should be on the far side FROM the person.
 * Person sits on one side, monitors on the opposite edge.
 * 
 * For viewer: we're looking from above-south.
 * Top person (facing down) sees monitors on the FAR side = NEAR side to viewer = BOTTOM edge of top desk
 * So actually: top desk monitors at bottom edge → we see SCREEN (facing us and the person)
 * Bottom desk monitors at top edge → we see BACK (facing away, toward person below)
 *
 * NO WAIT: "человек сидит и смотрит на них" - person sits and looks at monitors.
 * The monitors face the person. Person faces the desk. Monitors are on the desk.
 * In 2.5D top-down: 
 *   - Person at yt-1 faces DOWN. Their desk is at yt. Monitors on the desk face UP toward them.
 *     From our POV we see the monitors from above → we see their BACKS
 *   - Person at yt+2 faces UP. Their desk is at yt+1. Monitors face DOWN toward them.
 *     From our POV → we see the SCREENS
 *
 * User said "экран монитора снизу а не сверху" = we see the screen from below (bottom person's monitors)
 * This matches: bottom desk = screen visible to viewer.
 * But monitors should be on FAR edge: for top desk, far from person = TOP edge. For bottom desk, far = BOTTOM edge.
 */

function drawDesk(c,px,py,w){
    // Pixelated desk with wood grain
    c.fillStyle='#7a5530';c.fillRect(px,py,w,T);
    c.fillStyle='#8b6840';c.fillRect(px+2,py+2,w-4,T-4);
    // Wood grain (pixelated)
    for(let i=4;i<w-4;i+=6){
        c.fillStyle='rgba(60,35,15,0.15)';c.fillRect(px+i,py+3,2,T-6);
    }
    // Edge highlight
    c.fillStyle='rgba(255,255,255,0.08)';c.fillRect(px+2,py+2,w-4,2);
    c.fillStyle='rgba(0,0,0,0.15)';c.fillRect(px+2,py+T-3,w-4,2);
    // Outline
    c.strokeStyle='#000';c.lineWidth=1.5;c.strokeRect(px+.5,py+.5,w-1,T-1);
    // Legs
    c.fillStyle='#5a3a20';
    c.fillRect(px+2,py+T-1,3,4);c.fillRect(px+w-5,py+T-1,3,4);
}

function drawKbd(c,px,py){
    // Keyboard (pixelated)
    c.fillStyle='#222';c.fillRect(px,py,30,10);
    c.fillStyle='#333';
    for(let r=0;r<3;r++)for(let k=0;k<7;k++)c.fillRect(px+2+k*4,py+2+r*3,3,2);
    // Mouse
    c.fillStyle='#444';c.fillRect(px+34,py+2,5,7);
    c.strokeStyle='#333';c.lineWidth=.5;c.strokeRect(px+34,py+2,5,7);
}

function drawChair(c,px,py,dir){
    if(dir==='down'){
        // Seat
        c.fillStyle='#2a2a2a';c.fillRect(px,py+6,16,12);
        c.fillStyle='#383838';c.fillRect(px+2,py+8,12,8);
        // Backrest (top)
        c.fillStyle='#222';c.fillRect(px-1,py,18,7);
        c.fillStyle='#333';c.fillRect(px+1,py+2,14,4);
        // Wheels
        c.fillStyle='#1a1a1a';
        c.fillRect(px-2,py+17,4,3);c.fillRect(px+14,py+17,4,3);c.fillRect(px+5,py+19,6,3);
    }else{
        c.fillStyle='#2a2a2a';c.fillRect(px,py+4,16,12);
        c.fillStyle='#383838';c.fillRect(px+2,py+6,12,8);
        c.fillStyle='#222';c.fillRect(px-1,py+15,18,7);
        c.fillStyle='#333';c.fillRect(px+1,py+16,14,4);
        c.fillStyle='#1a1a1a';
        c.fillRect(px-2,py+2,4,3);c.fillRect(px+14,py+2,4,3);c.fillRect(px+5,py,6,3);
    }

function drawMon(c,px,py,w,screen){
    // Monitor spans given width
    const mw=w,mh=20;
    if(screen){
        c.fillStyle='#111';c.fillRect(px,py,mw,mh);
        c.strokeStyle='#000';c.lineWidth=1.5;c.strokeRect(px,py,mw,mh);
        // Screen
        const g=c.createLinearGradient(px+3,py+2,px+mw-3,py+mh-3);
        g.addColorStop(0,'#2878c0');g.addColorStop(.5,'#3090e0');g.addColorStop(1,'#2070b0');
        c.fillStyle=g;c.fillRect(px+3,py+2,mw-6,mh-5);
        // Scanlines
        for(let i=0;i<mh-6;i+=2){c.fillStyle='rgba(0,0,0,0.08)';c.fillRect(px+3,py+2+i,mw-6,1);}
        // Code lines
        c.fillStyle='rgba(180,255,180,0.5)';
        c.fillRect(px+6,py+4,14,2);c.fillRect(px+22,py+4,8,2);
        c.fillRect(px+8,py+8,20,2);
        c.fillRect(px+6,py+12,10,2);c.fillRect(px+18,py+12,16,2);
        // Stand
        c.fillStyle='#222';c.fillRect(px+mw/2-4,py+mh,8,4);
        c.fillStyle='#333';c.fillRect(px+mw/2-8,py+mh+3,16,3);
    }else{
        // Back of monitor
        c.fillStyle='#1a1a1a';c.fillRect(px,py,mw,mh);
        c.strokeStyle='#000';c.lineWidth=1.5;c.strokeRect(px,py,mw,mh);

function cw(x,y){if(x<0||y<0||x>=MW||y>=MH)return false;return M[y][x]===0||M[y][x]===2;}
function bfs(sx,sy,ex,ey){
    if(!cw(ex,ey))return null;
    const v=new Set(),q=[[sx,sy,[]]];v.add(sx+','+sy);
    while(q.length){
        const[x,y,p]=q.shift();
        if(x===ex&&y===ey)return p;
        for(const[dx,dy]of[[0,-1],[0,1],[-1,0],[1,0]]){
            const nx=x+dx,ny=y+dy,k=nx+','+ny;
            if(!v.has(k)&&cw(nx,ny)){v.add(k);q.push([nx,ny,[...p,{x:nx,y:ny}]]);}
        }
        if(p.length>100)return null;
    }
    return null;
}

let stT=0;
function update(dt){
    stT+=dt;
    if(stT>20+Math.random()*20){
        stT=0;
        chars.forEach(c=>{
            if(Math.random()>0.5){
                if(c.status==='active'){
                    c.status='idle';
                    const s=idles[Math.floor(Math.random()*idles.length)];
                    const p=bfs(Math.round(c.x),Math.round(c.y),s.x,s.y);
                    if(p&&p.length){c.path=p;c.moving=true;c.idleDir=s.dir;c.idleAct=s.act;}
                }else{
                    c.status='active';
                    const p=bfs(Math.round(c.x),Math.round(c.y),c.desk.x,c.desk.y);
                    if(p&&p.length){c.path=p;c.moving=true;}
                    else{c.x=c.desk.x;c.y=c.desk.y;c.moving=false;}
                }
            }
        });
    }
    chars.forEach(c=>{
        if(c.moving&&c.path.length){
            const t=c.path[0],dx=t.x-c.x,dy=t.y-c.y,d=Math.sqrt(dx*dx+dy*dy);
            if(d<0.05){
                c.x=t.x;c.y=t.y;c.path.shift();
                if(!c.path.length){c.moving=false;c.frame=0;c.dir=c.status==='active'?c.ddir:c.idleDir;}
            }else{
                c.x+=(dx/d)*1.2*dt;c.y+=(dy/d)*1.2*dt;
                c.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?1:3):(dy<0?0:2);
                c.ft+=dt;if(c.ft>.1){c.frame=(c.frame%8)+1;c.ft=0;}
            }
        }else if(!c.moving){c.frame=0;c.dir=c.status==='active'?c.ddir:c.idleDir;}
    });
}

function drawChars(){
    [...chars].sort((a,b)=>a.y-b.y).forEach(c=>{
        const img=si[c.id];if(!img)return;
        // When sitting (not moving), shift sprite down slightly to look seated
        const sitting=!c.moving&&c.frame===0;
        const sitOff=sitting?4:0;
        const dx=c.x*T+T/2-SS/2,dy=c.y*T+T-SS+4+sitOff;
        cx.fillStyle='rgba(0,0,0,0.15)';
        cx.beginPath();cx.ellipse(c.x*T+T/2,c.y*T+T-1,10,4,0,0,Math.PI*2);cx.fill();
        // When sitting, clip bottom of sprite slightly (hide feet under desk)
        const srcH=sitting?58:64;
        cx.drawImage(img,c.frame*64,c.dir*64,64,srcH,dx,dy,SS,SS*(srcH/64));
        // Status dot
        cx.fillStyle=c.status==='active'?'#4a4':'#888';
        cx.beginPath();cx.arc(c.x*T+T/2,dy-3,4,0,Math.PI*2);cx.fill();
        cx.strokeStyle='#000';cx.lineWidth=.5;cx.beginPath();cx.arc(c.x*T+T/2,dy-3,4,0,Math.PI*2);cx.stroke();
        // Name
        cx.font='bold 8px monospace';cx.textAlign='center';
        const lbl=c.name.split(' ')[0],lw=cx.measureText(lbl).width;
        cx.fillStyle='rgba(0,0,0,0.6)';cx.fillRect(c.x*T+T/2-lw/2-3,c.y*T+T+3,lw+6,12);
        cx.fillStyle='#fff';cx.fillText(lbl,c.x*T+T/2,c.y*T+T+12);
        cx.textAlign='left';
    });
}

const tip=document.getElementById('tip');
cv.addEventListener('mousemove',e=>{
    const r=cv.getBoundingClientRect(),sx=cv.width/r.width,sy=cv.height/r.height;
    const mx=(e.clientX-r.left)*sx,my=(e.clientY-r.top)*sy;
    let h=null;
    chars.forEach(c=>{if(Math.abs(mx-c.x*T-T/2)<24&&Math.abs(my-c.y*T-T/2)<32)h=c;});
    if(h){
        tip.style.display='block';tip.style.left=(e.clientX+15)+'px';tip.style.top=(e.clientY+15)+'px';
        const st=h.status==='active'?'🟢 Working':(h.idleAct==='dart'?'🎯 Playing darts':'☕ Chilling');
        tip.innerHTML='<div class="n">'+h.name+'</div><div class="r">'+h.role+'</div><div class="s" style="color:'+(h.status==='active'?'#4a4':'#888')+'">'+st+'</div>';
    }else tip.style.display='none';
});
cv.addEventListener('mouseleave',()=>{tip.style.display='none';});

let lt=0;
function frame(t){
    const dt=Math.min((t-lt)/1000,.1);lt=t;
    cx.clearRect(0,0,cv.width,cv.height);
    cx.drawImage(bgC,0,0);
    update(dt);drawChars();
    drawFg();cx.drawImage(fgC,0,0);
    requestAnimationFrame(frame);
}
function go(){drawBg();requestAnimationFrame(frame);}
if(ld===ns.length)go();
</script>
